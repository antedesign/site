<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Anté Insights cover: the double diamond, with both convergence points marked">
  <title>The Double Diamond, with its two decision points marked</title>

  <!-- ============================================================
       ANTÉ INSIGHTS — COVER TEMPLATE v1
       Canvas 1200x630 (Open Graph ratio). Charcoal ground, blueprint
       grid, one geometric motif carrying the post's argument, three
       signature ticks top-right, anté wordmark bottom-left.
       No <text> anywhere: the cover must render identically in an
       <img>, in a social card and in a PNG export, where brand fonts
       are not available. Labels are overlaid in HTML instead.
       Palette: charcoal #28292B / spruce #206A5B / frosted #9CE3F8
       ============================================================ -->

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9CE3F8" stroke-width="1" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CE3F8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9CE3F8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CE3F8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9CE3F8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28292B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1B1C1E" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1200" height="630" fill="#28292B"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- motif: two diamonds, problem space then solution space -->
  <g>
    <!-- glow behind each convergence point -->
    <circle cx="570" cy="315" r="105" fill="url(#glowA)"/>
    <circle cx="1030" cy="315" r="118" fill="url(#glowB)"/>

    <!-- diamond one — the problem -->
    <polygon points="170,315 370,160 570,315 370,470"
             fill="#206A5B" fill-opacity="0.42"
             stroke="#9CE3F8" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="370" y1="160" x2="370" y2="470"
          stroke="#9CE3F8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 7"/>

    <!-- diamond two — the solution -->
    <polygon points="630,315 830,160 1030,315 830,470"
             fill="#206A5B" fill-opacity="0.28"
             stroke="#9CE3F8" stroke-opacity="0.42" stroke-width="2"/>
    <line x1="830" y1="160" x2="830" y2="470"
          stroke="#9CE3F8" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 7"/>

    <!-- the handover between the two diamonds -->
    <line x1="570" y1="315" x2="630" y2="315"
          stroke="#9CE3F8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 6"/>

    <!-- the two decision points: the actual subject of the post -->
    <g>
      <circle cx="570" cy="315" r="34" fill="none" stroke="#9CE3F8" stroke-opacity="0.16" stroke-width="1.5"/>
      <circle cx="570" cy="315" r="21" fill="none" stroke="#9CE3F8" stroke-opacity="0.34" stroke-width="1.5"/>
      <circle cx="570" cy="315" r="9" fill="#9CE3F8"/>
    </g>
    <g>
      <circle cx="1030" cy="315" r="34" fill="none" stroke="#9CE3F8" stroke-opacity="0.16" stroke-width="1.5"/>
      <circle cx="1030" cy="315" r="21" fill="none" stroke="#9CE3F8" stroke-opacity="0.34" stroke-width="1.5"/>
      <circle cx="1030" cy="315" r="9" fill="#9CE3F8"/>
    </g>
  </g>

  <!-- signature ticks, top right — repeats on every cover -->
  <g stroke="#9CE3F8" stroke-width="2" stroke-linecap="square">
    <line x1="1056" y1="72" x2="1056" y2="100" stroke-opacity="0.9"/>
    <line x1="1072" y1="72" x2="1072" y2="100" stroke-opacity="0.45"/>
    <line x1="1088" y1="72" x2="1088" y2="100" stroke-opacity="0.2"/>
  </g>

  <!-- baseline rule -->
  <line x1="72" y1="516" x2="1128" y2="516" stroke="#9CE3F8" stroke-opacity="0.14" stroke-width="1"/>

  <!-- vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- anté wordmark, drawn as paths so no font is required -->
  <svg x="72" y="542" width="108" height="36" viewBox="300 1490 3570 1185">
    <g transform="matrix(3.652908,0,0,3.652908,342.570591,1533.391111)" fill="#9CE3F8">
