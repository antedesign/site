      <g transform="matrix(4.166667,0,0,4.166667,0,0)"><path fill-rule="nonzero" d="M119.57,35.21L114.6,70.85L98.75,70.85L103.41,37.12C103.88,33.81 103.29,31.15 101.6,29.13C99.9,27.12 97.51,26.11 94.41,26.11C92.36,26.11 90.47,26.58 88.74,27.49C87.02,28.41 85.58,29.69 84.47,31.31C83.34,32.93 82.6,34.86 82.23,37.12L77.59,70.85L61.72,70.85L69.77,13.12L84.57,13.12L83.75,19.46C85.37,17.1 87.4,15.31 89.81,14.12C92.87,12.6 96.34,11.84 100.22,11.84C104.65,11.84 108.43,12.89 111.53,14.96C114.63,17.03 116.91,19.85 118.35,23.36C119.81,26.89 120.2,30.83 119.56,35.21L119.57,35.21Z"/></g>
      <g transform="matrix(4.166667,0,0,4.166667,0,0)"><path fill-rule="nonzero" d="M153.53,71.49C146.41,71.49 141.12,69.54 137.67,65.62C134.22,61.71 132.95,56.37 133.86,49.6L137.03,26.87L127.3,26.87L129.2,13.12L129.41,13.12C132.37,13.12 134.82,12.31 136.76,10.69C138.7,9.07 139.88,6.78 140.3,3.82L140.84,0L156.91,0L155.01,13.11L168.33,13.11L166.43,26.86L153.11,26.86L149.94,49.38C149.66,51.35 149.73,52.96 150.15,54.19C150.57,55.42 151.4,56.32 152.63,56.89C153.86,57.45 155.54,57.73 157.65,57.73C158.28,57.73 158.9,57.71 159.5,57.68C160.1,57.65 160.86,57.56 161.77,57.42L160.61,70.85C159.55,71.13 158.37,71.31 157.07,71.38C155.76,71.45 154.59,71.48 153.53,71.48L153.53,71.49Z"/></g>
      <g transform="matrix(4.166667,0,0,4.166667,0,0)"><path fill-rule="nonzero" d="M225.6,24.64C223.51,20.7 220.47,17.58 216.44,15.28C215.02,14.48 213.52,13.82 211.88,13.31L221.49,0.01L201.08,0.01L195.25,12.51C193.26,12.9 191.33,13.52 189.48,14.34C185.74,16 182.46,18.3 179.65,21.26C176.82,24.24 174.64,27.62 173.08,31.46C171.54,35.32 170.76,39.45 170.76,43.9C170.76,49.12 171.91,53.86 174.21,58.17C176.49,62.46 179.79,65.87 184.09,68.37C188.38,70.87 193.47,72.13 199.32,72.13C203.2,72.13 206.81,71.56 210.16,70.43C213.51,69.3 216.44,67.7 218.99,65.63C221.52,63.56 223.47,61.09 224.8,58.28L212.32,51.83C211.13,53.8 209.43,55.38 207.25,56.59C205.07,57.78 202.53,58.38 199.63,58.38C196.96,58.38 194.66,57.85 192.75,56.8C190.86,55.73 189.4,54.17 188.42,52.1C187.64,50.46 187.18,48.05 187.01,45.92L227.55,46.44C227.9,44.9 228.19,43.44 228.39,42.11C228.6,40.78 228.72,39.44 228.72,38.09C228.72,33.1 227.67,28.63 225.6,24.66L225.6,24.64ZM188.37,34.57C189.31,31.55 190.85,29.11 192.97,27.28C195.08,25.45 197.94,24.53 201.53,24.53C204.28,24.53 206.56,25.23 208.35,26.6C210.16,27.98 211.33,29.82 211.9,32.14C212.11,32.98 212.21,33.84 212.21,34.79L188.06,35.73C188.08,35.65 188.36,34.64 188.38,34.56L188.37,34.57Z"/></g>
    </g>
  </svg>
</svg>
